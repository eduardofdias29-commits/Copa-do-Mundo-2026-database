<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dashboard{% endblock %} — Copa 2026</title>
    <!-- Aplica o tema salvo ANTES do CSS carregar, pra não piscar o tema
         errado por uma fração de segundo ao trocar de página. -->
    <script>
        (function () {
            var temaSalvo = localStorage.getItem("copa2026-tema");
            if (temaSalvo === "claro") {
                document.documentElement.setAttribute("data-tema", "claro");
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>

    <div class="app-shell">

        <aside class="sidebar">
            <div class="sidebar-topo">
                <div class="sidebar-logo">
                    <img src="{{ url_for('static', filename='assets/tema/fifa-logo.png') }}" alt="FIFA World Cup 26" class="logo-fifa logo-fifa-claro">
                    <img src="{{ url_for('static', filename='assets/tema/fifa-logo-escuro.png') }}" alt="FIFA World Cup 26" class="logo-fifa logo-fifa-escuro">
                </div>

                <div class="sidebar-busca" id="sidebar-busca">
                    <div class="sidebar-busca-input-wrap">
                        <svg class="sidebar-busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="busca-input" class="sidebar-busca-input" autocomplete="off">
                        <div class="sidebar-busca-placeholder-wrap" id="busca-placeholder-wrap">
                            <span class="sidebar-busca-placeholder-texto" id="busca-placeholder-texto">Buscar jogador ou seleção…</span>
                        </div>
                    </div>
                    <div class="sidebar-busca-resultados" id="busca-resultados" hidden></div>
                </div>

                <nav class="sidebar-nav">
                    <a href="{{ url_for('pagina_dashboard') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'dashboard' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                        Hub
                    </a>
                    <a href="{{ url_for('pagina_selecoes') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'selecoes' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
                        Seleções
                    </a>
                    <a href="{{ url_for('pagina_classificacao') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'classificacao' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v3a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4"/><path d="M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg></span>
                        Fase de Grupos
                    </a>
                    <a href="{{ url_for('pagina_rankings') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'rankings' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
                        Estatísticas
                    </a>
                    <a href="{{ url_for('pagina_treinadores') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'treinadores' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                        Treinadores
                    </a>
                    <a href="{{ url_for('pagina_mata_mata') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'mata-mata' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></span>
                        Mata-Mata
                    </a>
                    <a href="{{ url_for('pagina_estadios') }}"
                       class="nav-item {{ 'ativo' if pagina_ativa == 'estadios' else '' }}">
                        <span class="nav-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 21 8 3 8"/></svg></span>
                        Estádios
                    </a>
                </nav>
            </div>

            <div class="sidebar-rodape">
                <div class="sidebar-rodape-acoes">
                    <a href="https://github.com/eduardofdias29-commits" target="_blank" rel="noopener noreferrer"
                       class="botao-tema" aria-label="Ver código no GitHub" title="Ver código no GitHub">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.2.66.8.55A10.53 10.53 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
                        </svg>
                    </a>
                    <button type="button" id="botao-tema" class="botao-tema" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
                        <svg class="icone-tema icone-tema-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <line x1="12" y1="2" x2="12" y2="4"/>
                            <line x1="12" y1="20" x2="12" y2="22"/>
                            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/>
                            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                            <line x1="2" y1="12" x2="4" y2="12"/>
                            <line x1="20" y1="12" x2="22" y2="12"/>
                            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
                            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
                        </svg>
                        <svg class="icone-tema icone-tema-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <main class="conteudo conteudo-{{ pagina_ativa }}">
            {% block conteudo %}{% endblock %}
        </main>

    </div>

    <script src="{{ url_for('static', filename='busca-global.js') }}"></script>
    <script src="{{ url_for('static', filename='tema.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
